<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Flat colours only (ImageMagick drops gradients to black on raster).
       Front view of a classic VW T1 Bulli: split V-windshield, round
       centre badge with a heart, two heart-shaped headlights, chrome
       bumper. Cream-over-turquoise two-tone with a soft cream sky.
       OS adds the corner mask on install. -->

  <!-- full-bleed soft sky background -->
  <rect width="512" height="512" fill="#7DD3FC"/>

  <!-- soft sun/glow disc -->
  <circle cx="420" cy="110" r="44" fill="#FEF3C7"/>

  <!-- ground band -->
  <rect x="0" y="450" width="512" height="62" fill="#86EFAC"/>

  <!-- ============== VW T1 BULLI FRONT VIEW ============== -->
  <!-- All offsets centred on x=256. Body is wider than tall, roof curves
       smoothly into the front face. -->

  <!-- ROOF / upper body (cream, rounded top) -->
  <path d="M 96 200
           Q 96 110 256 110
           Q 416 110 416 200
           L 416 248
           L 96 248 Z"
        fill="#FEF3C7"
        stroke="#1E3A8A" stroke-width="5"/>

  <!-- LOWER body (turquoise / classic Bulli lower) -->
  <path d="M 80 248
           L 432 248
           L 432 430
           Q 432 442 420 442
           L 92 442
           Q 80 442 80 430 Z"
        fill="#06B6D4"
        stroke="#1E3A8A" stroke-width="5"/>

  <!-- horizontal trim line between cream and turquoise -->
  <rect x="80" y="246" width="352" height="6" fill="#1E3A8A"/>

  <!-- ========= SPLIT-WINDOW WINDSCREEN (V-shape, the icon's signature) ========= -->
  <!-- left pane -->
  <path d="M 130 145
           L 250 145
           L 250 232
           L 142 232
           Q 134 232 132 226
           L 124 178
           Q 122 165 130 145 Z"
        fill="#1E3A8A"/>
  <!-- right pane -->
  <path d="M 262 145
           L 382 145
           L 388 178
           Q 390 165 388 178
           L 380 226
           Q 378 232 370 232
           L 262 232 Z"
        fill="#1E3A8A"/>
  <!-- centre divider (the V-strut) -->
  <rect x="250" y="142" width="12" height="92" fill="#FEF3C7"
        stroke="#1E3A8A" stroke-width="3"/>

  <!-- ========= CENTRE ROUND BADGE (heart instead of VW) ========= -->
  <circle cx="256" cy="310" r="42" fill="#FEF3C7"
          stroke="#1E3A8A" stroke-width="5"/>
  <!-- heart inside the badge -->
  <path d="M 256 332
           C 236 318 226 302 232 290
           C 238 280 252 280 256 292
           C 260 280 274 280 280 290
           C 286 302 276 318 256 332 Z"
        fill="#EF4444"/>

  <!-- ========= HEART HEADLIGHTS (left + right of the bumper area) ========= -->
  <!-- left headlight -->
  <path d="M 142 400
           C 124 388 116 374 122 364
           C 128 356 140 356 144 366
           C 148 356 160 356 166 364
           C 172 374 160 388 142 400 Z"
        fill="#FBBF24"
        stroke="#92400E" stroke-width="3"/>
  <!-- right headlight -->
  <path d="M 370 400
           C 352 388 344 374 350 364
           C 356 356 368 356 372 366
           C 376 356 388 356 394 364
           C 400 374 388 388 370 400 Z"
        fill="#FBBF24"
        stroke="#92400E" stroke-width="3"/>

  <!-- ========= CHROME BUMPER ========= -->
  <rect x="64" y="430" width="384" height="20" rx="6"
        fill="#E5E7EB" stroke="#1E3A8A" stroke-width="4"/>

  <!-- ========= WHEELS (peeking under bumper) ========= -->
  <circle cx="130" cy="468" r="26" fill="#1F2937"/>
  <circle cx="130" cy="468" r="11" fill="#9CA3AF"/>
  <circle cx="382" cy="468" r="26" fill="#1F2937"/>
  <circle cx="382" cy="468" r="11" fill="#9CA3AF"/>

  <!-- ========= TINY HEART FLOATING ABOVE ROOF (love accent) ========= -->
  <path d="M 256 88
           C 244 78 236 68 240 60
           C 244 54 254 54 256 62
           C 258 54 268 54 272 60
           C 276 68 268 78 256 88 Z"
        fill="#F472B6"
        stroke="#831843" stroke-width="2"/>
</svg>
