<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Flat colours only (ImageMagick drops gradients to black on raster).
       Bright alpine-sky background; mountain + sun motif reads at any size.
       OS adds the corner mask on install. -->

  <!-- full-bleed sky background -->
  <rect width="512" height="512" fill="#38BDF8"/>

  <!-- sun (top-right) -->
  <circle cx="400" cy="130" r="50" fill="#FBBF24"/>

  <!-- back mountain (lighter, recedes) -->
  <path d="M 0 410
           L 130 220
           L 220 320
           L 290 230
           L 380 320
           L 460 250
           L 512 290
           L 512 510
           L 0 510 Z"
        fill="#1D4ED8"/>
  <!-- snowcap on back mountain (right peak) -->
  <path d="M 270 260
           L 290 230
           L 312 262
           L 302 262
           L 290 248
           L 280 262 Z"
        fill="#F9FAFB"/>

  <!-- front mountain (darker, dominant centre triangle) -->
  <path d="M 60 420
           L 200 160
           L 340 420 Z"
        fill="#1E3A8A"/>
  <!-- snowcap on front mountain — covers the whole top wedge -->
  <path d="M 145 268
           L 200 160
           L 256 268
           L 240 254
           L 224 268
           L 208 254
           L 192 268
           L 176 254
           L 160 268 Z"
        fill="#F9FAFB"/>

  <!-- second front mountain to the right (smaller, lighter) -->
  <path d="M 280 420
           L 380 240
           L 480 420 Z"
        fill="#1D4ED8"/>
  <!-- snowcap -->
  <path d="M 348 290
           L 380 240
           L 414 290
           L 400 278
           L 388 290
           L 376 278
           L 362 290 Z"
        fill="#F9FAFB"/>

  <!-- foreground ground band -->
  <rect x="0" y="410" width="512" height="100" fill="#15803D"/>

  <!-- trail (winding white path on green ground) -->
  <path d="M 80 510
           Q 160 470 200 460
           Q 280 450 360 480
           Q 420 495 512 470"
        stroke="#F9FAFB" stroke-width="14" fill="none"
        stroke-linecap="round" stroke-dasharray="2 22"/>
</svg>
