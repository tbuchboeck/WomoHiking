<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Flat colours only (ImageMagick drops gradients to black on raster).
       Bright alpine-sky background with a side-profile motorhome (the
       app's signature "Womo" angle — Elnagh-inspired) and a small hiking
       boot as accent. OS adds the corner mask on install. -->

  <!-- full-bleed bright sky background -->
  <rect width="512" height="512" fill="#38BDF8"/>

  <!-- distant mountain band (subtle outdoor framing) -->
  <path d="M 0 320
           L 90 230
           L 160 280
           L 230 220
           L 320 280
           L 400 240
           L 512 270
           L 512 380
           L 0 380 Z"
        fill="#1D4ED8"/>
  <!-- snowcap on one peak -->
  <path d="M 215 235
           L 230 220
           L 248 240
           L 238 240
           L 230 232
           L 222 240 Z"
        fill="#F9FAFB"/>

  <!-- green ground band -->
  <rect x="0" y="380" width="512" height="132" fill="#15803D"/>

  <!-- ============== MOTORHOME (side profile, facing right) ============== -->

  <!-- living-area body — tall white box -->
  <rect x="76" y="200" width="240" height="160" rx="14" fill="#F9FAFB"
        stroke="#1E3A8A" stroke-width="6"/>

  <!-- cab (driver area) — slightly shorter box on the right -->
  <path d="M 316 240
           L 316 360
           L 436 360
           L 436 290
           Q 436 270 416 264
           L 380 254
           Q 360 248 348 240 Z"
        fill="#F9FAFB" stroke="#1E3A8A" stroke-width="6"/>

  <!-- windshield (slanted, dark) -->
  <path d="M 354 246
           L 422 268
           Q 428 270 428 278
           L 428 296
           Q 428 304 420 304
           L 354 304 Z"
        fill="#1E3A8A"/>

  <!-- side window of cab (driver door) -->
  <rect x="334" y="266" width="14" height="36" fill="#1E3A8A"/>

  <!-- living-area windows (two) -->
  <rect x="100" y="230" width="70" height="50" rx="6" fill="#1E3A8A"/>
  <rect x="190" y="230" width="70" height="50" rx="6" fill="#1E3A8A"/>

  <!-- door with small window (between windows and right edge) -->
  <rect x="270" y="234" width="38" height="120" rx="4" fill="#FBBF24"
        stroke="#1E3A8A" stroke-width="4"/>
  <rect x="280" y="248" width="18" height="22" rx="2" fill="#1E3A8A"/>
  <circle cx="302" cy="298" r="3" fill="#1E3A8A"/>

  <!-- decorative red stripe along the body -->
  <rect x="82" y="320" width="234" height="10" fill="#EF4444"/>

  <!-- wheels -->
  <circle cx="130" cy="370" r="28" fill="#1F2937"/>
  <circle cx="130" cy="370" r="12" fill="#9CA3AF"/>
  <circle cx="390" cy="370" r="28" fill="#1F2937"/>
  <circle cx="390" cy="370" r="12" fill="#9CA3AF"/>

  <!-- ============== HIKING BOOT (small accent, bottom-left) ============== -->

  <!-- sole -->
  <path d="M 38 480
           L 38 466
           Q 38 460 44 460
           L 152 460
           Q 162 460 170 466
           L 170 480 Z"
        fill="#1F2937"/>

  <!-- upper -->
  <path d="M 44 460
           L 44 416
           Q 44 408 52 408
           L 96 408
           Q 104 408 108 416
           L 124 446
           Q 130 458 142 460
           L 170 460 Z"
        fill="#92400E"/>

  <!-- collar/cuff -->
  <path d="M 44 416
           Q 44 408 52 408
           L 96 408
           Q 104 408 108 416
           L 104 422
           Q 100 416 92 416
           L 56 416
           Q 50 416 50 424 Z"
        fill="#FBBF24"/>

  <!-- laces (3 short bars) -->
  <g stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="58" y1="428" x2="96" y2="428"/>
    <line x1="58" y1="438" x2="96" y2="438"/>
    <line x1="58" y1="448" x2="100" y2="448"/>
  </g>
</svg>
